<title>Fortnight Shop</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: one narrow column, sticky store switcher, aisle groups as plain lists with large tap rows, bottom sheet for editing */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#1b2420; --muted:#66736c; --line:#dde3de;
  --accent:#1f6b5c; --accent-soft:#dcece7; --ww:#8a5a12; --ww-soft:#f4e8d2; --rec:#5b4a8a; --rec-soft:#e9e5f4;
  --scrim:rgba(20,28,24,.45); --warn:#9a5b00; --warn-soft:#fbeed3;
  --display:"Familjen Grotesk",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121715; --surface:#1a211e; --fg:#e6ece8; --muted:#94a29a; --line:#2a332f;
  --accent:#6cc2ad; --accent-soft:#1d3530; --ww:#e0b46a; --ww-soft:#3a2e18; --rec:#b8a8ec; --rec-soft:#2b2640;
  --scrim:rgba(0,0,0,.6); --warn:#f0b65c; --warn-soft:#3b2c12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121715; --surface:#1a211e; --fg:#e6ece8; --muted:#94a29a; --line:#2a332f;
  --accent:#6cc2ad; --accent-soft:#1d3530; --ww:#e0b46a; --ww-soft:#3a2e18; --rec:#b8a8ec; --rec-soft:#2b2640;
  --scrim:rgba(0,0,0,.6); --warn:#f0b65c; --warn-soft:#3b2c12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.4}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px calc(48px + env(safe-area-inset-bottom,0px))}
header h1{font-family:var(--display);font-weight:700;font-size:clamp(1.5rem,6vw,1.9rem);margin:0;letter-spacing:-.01em;text-wrap:balance}
header p{margin:4px 0 0;color:var(--muted);font-size:.9rem}
.sync{display:flex;align-items:center;gap:6px;font-size:.8rem!important}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync[data-s="live"]::before{background:var(--accent)}
.sync[data-s="ro"]::before,.sync[data-s="err"]::before{background:var(--warn)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;display:grid;gap:8px;margin-inline:-4px;padding-inline:4px}
.shop-tools{display:grid;grid-template-columns:minmax(0,1fr);gap:6px;margin-top:4px}
.bar{grid-template-columns:minmax(0,1fr)}
form.add input{width:0}
#import-btn{padding-inline:12px}
#photo-wrap{display:contents}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.tab{font:inherit;font-family:var(--display);font-weight:700;border:0;border-radius:9px;padding:9px 4px;background:transparent;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px}
.tab small{font-family:var(--body);font-weight:400;font-size:.72rem;white-space:nowrap}
.tab .short{display:none}
@media (max-width:460px){.tab .long{display:none}.tab .short{display:inline}.tab{font-size:.92rem;padding-inline:2px}}
.tab[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tab.ww[aria-pressed="true"]{background:var(--ww-soft);color:var(--ww)}
.tab.rec[aria-pressed="true"]{background:var(--rec-soft);color:var(--rec)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.progress{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.ww-mode .progress i{background:var(--ww)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:.85rem;color:var(--muted)}
.tools label{display:flex;align-items:center;gap:6px;cursor:pointer}
.tools .sp{flex:1}
.link{font:inherit;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px}
form.add{display:flex;gap:8px}
form.add input{flex:1;min-width:0;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.btn{font:inherit;font-weight:700;border:0;border-radius:10px;padding:10px 16px;background:var(--accent);color:var(--surface);cursor:pointer}
.ww-mode .btn.primary-store{background:var(--ww)}
.btn.ghost{background:var(--surface);color:var(--fg);border:1px solid var(--line);font-weight:400}
.btn.danger{background:transparent;color:#b3412e;border:1px solid var(--line);font-weight:400}
.btn:disabled{opacity:.5;cursor:default}
.pastebox{min-height:64px;border:1.5px dashed var(--line);border-radius:10px;padding:10px 12px;background:var(--bg);color:var(--muted);overflow:hidden}
.pastebox:empty::before{content:attr(data-msg);}
.pastebox:not([data-msg]):empty::before{content:"Long-press here and tap Paste";}
.pastebox img{max-height:60px}
.warn-note{color:var(--warn);background:var(--warn-soft);border-radius:10px;padding:8px 10px;margin:0}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;flex:1}
.filebtn input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:0}
.filebtn:focus-within{outline:2px solid var(--accent);outline-offset:2px}
#nr-pstatus:empty{display:none}
.photo-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%}
section{margin-top:16px}
section h2{font-family:var(--display);font-weight:500;font-size:.78rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 6px;display:flex;justify-content:space-between;gap:8px}
ul{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
li{display:flex;align-items:center;gap:8px;padding:0 4px 0 14px;border-top:1px solid var(--line);min-height:54px}
li:first-child{border-top:0}
li label{flex:1;min-width:0;display:flex;align-items:center;gap:12px;cursor:pointer;padding-block:10px}
li input[type=checkbox],.rv input[type=checkbox]{appearance:none;width:22px;height:22px;flex:none;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;cursor:pointer;margin:0}
li input:checked,.rv input:checked{background:var(--accent);border-color:var(--accent)}
.ww-mode li input:checked{background:var(--ww);border-color:var(--ww)}
li input:checked::after,.rv input:checked::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.txt{min-width:0;display:grid;gap:2px}
.name{overflow-wrap:anywhere}
.qty{font-weight:700;font-variant-numeric:tabular-nums;margin-right:4px}
.note{color:var(--muted);font-size:.85rem}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.picks{display:flex;flex-wrap:wrap;gap:6px}
.picks button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:999px;padding:6px 12px;cursor:pointer}
.picks button[aria-pressed="true"]{background:var(--rec-soft);border-color:var(--rec);color:var(--rec);font-weight:700}
.picks button[aria-pressed="true"]::before{content:"✓ "}
.newrec{display:flex;gap:6px}
.newrec input{flex:1;min-width:0}
.recipe h3 input{font:inherit;font-family:var(--display);font-size:1.15rem;font-weight:700;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--fg);padding:2px 0;min-width:0;flex:1}
.rsearch input{font:inherit;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.rrow{padding:0;gap:0}
.mrow{padding:0;gap:0}
.mrow button.open{flex:1;min-width:0;font:inherit;color:inherit;background:transparent;border:0;text-align:left;display:flex;align-items:center;gap:10px;padding:12px 14px 12px 0;cursor:pointer;min-height:58px}
.mrow .txt{flex:1}
.mrow .name{font-weight:700}
.mrow.made .name{color:var(--muted)}
.rhead{min-height:0;padding:10px 14px 6px;justify-content:space-between;font-family:var(--display);font-weight:500;font-size:.75rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);background:var(--bg)}
.fnav{display:flex;align-items:center;gap:8px;margin-top:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px}
.fbtn{font:inherit;font-size:1.5rem;line-height:1;width:44px;height:44px;border:0;border-radius:10px;background:var(--rec-soft);color:var(--rec);cursor:pointer;flex:none}
.fbtn:disabled{opacity:.35;cursor:default}
.ftitle{flex:1;min-width:0;display:grid;text-align:center;gap:1px}
.ftitle strong{font-family:var(--display)}
.ftitle span{font-size:.82rem;color:var(--muted)}
.addshop .actions{margin-top:8px}
.setaisle{font:inherit;font-size:.78rem;font-weight:700;border:1px dashed var(--ww);background:transparent;color:var(--ww);border-radius:999px;padding:7px 9px;cursor:pointer;white-space:nowrap}
section.unset h2{color:var(--ww)}
.aislegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:6px}
.aislegrid button{font:inherit;font-size:.85rem;min-height:44px;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;cursor:pointer;padding:4px}
.aislegrid button[aria-pressed="true"]{background:var(--ww-soft);border-color:var(--ww);color:var(--ww);font-weight:700}
#aq{font:inherit;font-size:16px;width:100%;box-sizing:border-box;min-height:84px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg)}
a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
a.btn.off{opacity:.55}
.ai-fab{position:fixed;z-index:15;right:max(16px,calc(env(safe-area-inset-right,0px) + 12px));bottom:calc(16px + env(safe-area-inset-bottom,0px));font:inherit;font-weight:700;font-size:.95rem;
  border:0;border-radius:999px;padding:13px 18px;background:var(--rec);color:var(--surface);box-shadow:0 6px 18px rgba(0,0,0,.18);cursor:pointer;min-height:48px}
html.sheet-open .ai-fab{display:none}
.wrap{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
.ai-wrap{display:grid;grid-template-rows:auto 1fr auto;gap:10px;height:calc(100dvh - 110px);min-height:0}
.ai-head{display:flex;align-items:center;justify-content:space-between;padding-right:44px}
.ai-head h2{margin:0}
.ai-log{overflow-y:auto;min-height:0;display:flex;flex-direction:column;gap:10px;overscroll-behavior:contain;padding-bottom:6px}
.ai-msg{max-width:88%;border-radius:14px;padding:10px 12px;font-size:.95rem;line-height:1.45;overflow-wrap:anywhere}
.ai-msg p{margin:0}.ai-msg p+p{margin-top:6px}
.ai-msg ul{margin:4px 0;padding:0 0 0 18px;background:none;border:0;border-radius:0;overflow:visible;list-style:disc}
.ai-msg li{display:list-item;min-height:0;border:0;padding:1px 0;gap:0}
.ai-msg.user{align-self:flex-end;background:var(--rec);color:var(--surface);border-bottom-right-radius:4px}
.ai-msg.assistant{align-self:flex-start;background:var(--bg);border:1px solid var(--line);border-bottom-left-radius:4px}
.ai-did{display:flex;flex-wrap:wrap;gap:4px;margin-top:8px}
.ai-did span{font-size:.75rem;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 8px}
.ai-wait{display:flex;gap:5px;padding:14px}
.ai-wait span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:aib 1s infinite ease-in-out}
.ai-wait span:nth-child(2){animation-delay:.15s}.ai-wait span:nth-child(3){animation-delay:.3s}
@keyframes aib{0%,80%,100%{opacity:.3;transform:translateY(0)}40%{opacity:1;transform:translateY(-3px)}}
.ai-hello{display:grid;gap:10px;color:var(--muted)}
.ai-hello p{margin:0}
.ai-chips{display:flex;flex-wrap:wrap;gap:6px}
.ai-chips button{font:inherit;font-size:.85rem;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:12px;padding:8px 10px;cursor:pointer}
.ai-form{display:flex;gap:8px;align-items:flex-end}
.sheet .ai-form textarea{min-height:44px;height:44px}
.ai-form textarea{flex:1;min-width:0;font:inherit;font-size:16px;resize:none;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--fg);max-height:140px}
.ai-form .btn{min-height:44px}
@media (prefers-reduced-motion:reduce){.ai-wait span{animation:none}}
.mini-x{font:inherit;font-size:1.2rem;border:0;background:transparent;color:var(--muted);width:40px;align-self:stretch;cursor:pointer;flex:none}
.addshop select{flex:1;min-width:0;width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg)}
.panel .tools{color:var(--fg)}
.again{font-size:.8rem;font-weight:700;color:var(--rec);border:1px solid var(--rec);border-radius:999px;padding:4px 9px;flex:none}
.madebox{display:grid;place-items:center;width:44px;height:58px;flex:none;cursor:pointer}
.madebox input{appearance:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:6px;margin:0;display:grid;place-items:center;cursor:pointer}
.madebox input:checked{background:var(--rec);border-color:var(--rec)}
.madebox input:checked::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:translateY(-1px) rotate(45deg)}
.rrow.made .name{color:var(--muted)}
.rrow button{flex:1;min-width:0;font:inherit;color:inherit;background:transparent;border:0;width:100%;text-align:left;display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;min-height:58px}
.rrow .txt{flex:1}
.rrow .name{font-weight:700}
.rrow .edit{flex:0 0 auto;width:auto;min-height:0;padding:10px 14px}
.chev{color:var(--muted);font-size:1.4rem;line-height:1}
.recipe-sheet{display:grid;gap:12px}
.madebar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
#rs-made[aria-pressed="true"]{background:var(--rec);color:var(--surface)}
#rs-made{border-color:var(--rec)}
.recipe-sheet h3{margin:0;display:flex;gap:10px;align-items:center}
.recipe-sheet h3 input{font:inherit;font-family:var(--display);font-size:1.3rem;font-weight:700;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--fg);padding:2px 0;min-width:0;flex:1}
.recipe-sheet textarea{font:inherit;width:100%;min-height:90px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);resize:vertical;font-size:.9rem}
.ingchip{display:inline-flex;align-items:center;gap:2px}
.ing .x{font:inherit;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:0 0 0 4px;font-size:1rem;line-height:1}
.ing span.d .x{text-decoration:none}
.seg.pc{flex:none;width:210px;grid-template-columns:repeat(3,1fr)}
.seg.pc.two{width:150px;grid-template-columns:1fr 1fr}
.needs{display:block;font-size:.78rem;color:var(--muted)}
.seg.pc button{padding:7px 4px;font-size:.85rem}
.seg.pc button[aria-pressed="true"][data-v="have"]{background:var(--line);color:var(--fg);font-weight:700}
.seg.pc button[aria-pressed="true"][data-v="add"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.trip{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:center;gap:8px;font-size:.8rem;color:var(--muted)}
.trip select{font:inherit;font-size:.9rem;font-weight:700;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-height:40px;width:100%}
.trip button{font:inherit;font-size:.85rem;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:7px 6px;cursor:pointer;min-height:38px}
.trip button[aria-pressed="true"][data-trip="both"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent);font-weight:700}
.trip button[aria-pressed="true"][data-trip="ww"]{background:var(--ww-soft);border-color:var(--ww);color:var(--ww);font-weight:700}
.trip-ww .tabs{grid-template-columns:repeat(3,minmax(0,1fr))}
.from-aldi{justify-self:start;font-size:.72rem;color:var(--muted);border:1px dashed var(--line);border-radius:999px;padding:1px 8px}
.totals{display:flex;flex-wrap:wrap;gap:4px 14px;align-items:baseline;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.totals strong{color:var(--fg);font-family:var(--display);font-size:1.05rem}
.totals .warn{color:var(--warn)}
.price{font-variant-numeric:tabular-nums;font-size:.9rem;white-space:nowrap;color:var(--fg)}
li.done .price{color:var(--muted)}
.avail{justify-self:start;font-size:.72rem;color:var(--warn);background:var(--warn-soft);border-radius:999px;padding:1px 8px}
.prices{gap:8px}
.pfield{display:grid;gap:4px;font-size:.82rem;color:var(--muted);border:1.5px solid transparent;border-radius:12px;padding:6px}
.pfield em{font-style:normal;font-size:.72rem;color:var(--accent);visibility:hidden;margin-left:4px}
.pfield.on{border-color:var(--accent);background:var(--accent-soft)}
.pfield.on em{visibility:visible}
#pf-ww.on{border-color:var(--ww);background:var(--ww-soft)}
#pf-ww.on em{color:var(--ww)}
.est-hint{font-size:.78rem;color:var(--muted)}
.estdot{color:var(--muted);font-size:.8rem;animation:estp 1.2s infinite ease-in-out}
@keyframes estp{50%{opacity:.4}}
@media (prefers-reduced-motion:reduce){.estdot{animation:none}}
li .setaisle+.edit{padding-left:6px}
.imp-tabs{display:grid;grid-template-columns:repeat(3,1fr)}
.imp-tabs button[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.sheet textarea{font:inherit;width:100%;min-height:140px;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);resize:vertical}
.chip{justify-self:start;font-size:.72rem;color:var(--rec);background:var(--rec-soft);border-radius:999px;padding:1px 8px}
li.done .name{text-decoration:line-through;color:var(--muted)}
.edit{font:inherit;font-size:.8rem;border:0;background:transparent;color:var(--muted);border-radius:8px;padding:10px;cursor:pointer;text-decoration:underline}
.empty{color:var(--muted);text-align:center;padding:40px 0}
.panel{margin-top:16px;padding:14px;border:1px dashed var(--line);border-radius:12px;font-size:.9rem;display:grid;gap:10px}
.panel .row{display:flex;gap:8px;flex-wrap:wrap}
/* recipes view */
.recipe{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.recipe h3{font-family:var(--display);font-size:1.15rem;margin:0;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.recipe h3 small{font-family:var(--body);font-weight:400;font-size:.8rem;color:var(--muted);white-space:nowrap}
.ing{display:flex;flex-wrap:wrap;gap:6px}
.ing span{font-size:.82rem;border:1px solid var(--line);border-radius:999px;padding:3px 9px}
.ing span.w{border-color:var(--ww);color:var(--ww)}
.ing span.d{text-decoration:line-through;color:var(--muted)}
.recipe textarea,.field input,.field select,.field textarea{font:inherit;width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.recipe textarea{min-height:70px;resize:vertical;font-size:.9rem}
.legend{font-size:.8rem;color:var(--muted)}
/* sheet */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding-block:18px calc(18px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:14px}
.sheet h2{font-family:var(--display);margin:0;font-size:1.3rem}
.field{display:grid;gap:5px;font-size:.85rem;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{font:inherit;width:42px;height:42px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg);font-size:1.2rem;cursor:pointer;flex:none}
.stepper input{text-align:center;font-variant-numeric:tabular-nums}
.storepick{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.storechk{display:flex;align-items:center;gap:10px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);font-size:1rem;cursor:pointer;min-height:48px}
.storechk input{appearance:none;width:22px;height:22px;flex:none;margin:0;border:2px solid var(--muted);border-radius:6px;display:grid;place-items:center;cursor:pointer}
.storechk input:checked::after{content:"";width:6px;height:11px;border:solid var(--surface);border-width:0 2.5px 2.5px 0;transform:translateY(-2px) rotate(45deg);box-sizing:content-box}
.storechk.on[data-v="aldi"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.storechk.on[data-v="aldi"] input{background:var(--accent);border-color:var(--accent)}
.storechk.on[data-v="ww"]{border-color:var(--ww);background:var(--ww-soft);color:var(--ww);font-weight:700}
.storechk.on[data-v="ww"] input{background:var(--ww);border-color:var(--ww)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{font:inherit;border:0;border-radius:8px;padding:8px;background:transparent;color:var(--muted);cursor:pointer}
.seg button[aria-pressed="true"][data-v="aldi"]{background:var(--accent-soft);color:var(--accent);font-weight:700}
.seg button[aria-pressed="true"][data-v="ww"]{background:var(--ww-soft);color:var(--ww);font-weight:700}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.actions .sp{flex:1}
.rv{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.rv:first-child{border-top:0}
.rv .txt{flex:1}
.status{font-size:.9rem;color:var(--muted)}
.err{color:#b3412e}
@media (max-width:380px){.grid2{grid-template-columns:1fr}}
/* phone: 16px inputs stop iOS zooming in, bigger tap targets, no double-tap zoom delay */
input,select,textarea,.pastebox{font-size:16px!important}
button,label,a,.tab{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.link{padding:10px 6px;min-height:40px}
.ing .x{padding:4px 6px;margin:-4px -6px -4px 0;font-size:1.15rem}
.ing span{padding:5px 10px}
.tools label{min-height:40px}
.tools input{width:20px;height:20px}
html.sheet-open,html.sheet-open body{overflow:hidden}
.sheet{max-height:calc(100dvh - 24px);overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.sheet-x{position:absolute;top:8px;right:max(8px,env(safe-area-inset-right,0px));font:inherit;font-size:1.5rem;line-height:1;width:44px;height:44px;border:0;border-radius:50%;background:transparent;color:var(--muted);cursor:pointer}
.sheet{position:relative;grid-template-columns:minmax(0,1fr)}
.recipe-sheet{grid-template-columns:minmax(0,1fr)}
.newrec input{width:0;font:inherit;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
.recipe-sheet h3 input{font-size:1.3rem!important}
.seg.imp-tabs{grid-template-columns:repeat(3,1fr)}
.sheet>h2,.sheet>.recipe-sheet>h3{padding-right:44px}
@media (max-width:420px){
  .rv{flex-wrap:wrap}
  .rv .seg.pc{width:100%}
  .actions .btn{flex:1 1 auto}
  .actions .sp{flex-basis:100%;height:0}
  .actions .link{order:9}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

<div class="wrap" id="app">
  <header>
    <h1>Fortnight Shop</h1>
    <p id="subhead">Next shop · Aldi first, Woolworths for the rest</p>
    <p class="sync" id="sync" data-s="local">Saved on this device</p>
  </header>

  <div class="bar">
    <div class="tabs" role="group" aria-label="View">
      <button class="tab" id="tab-aldi" data-view="aldi">Aldi<small id="count-aldi"></small></button>
      <button class="tab ww" id="tab-ww" data-view="ww"><span class="long">Woolworths</span><span class="short">Woolies</span><small id="count-ww"></small></button>
      <button class="tab rec" id="tab-rec" data-view="rec">Recipes<small id="count-rec"></small></button>
      <button class="tab rec" id="tab-made" data-view="made">Made<small id="count-made"></small></button>
    </div>
    <label class="trip" id="trip"><span>This fortnight I'm shopping at</span>
      <select id="trip-sel" aria-label="Where you're shopping this fortnight">
        <option value="both">Aldi &amp; Woolworths</option><option value="ww">Woolworths</option><option value="coles">Coles</option>
      </select></label>
    <div class="progress" id="prog-wrap"><i id="prog"></i></div>
    <div class="totals" id="totals"></div>
  </div>
  <div id="shop-tools" class="shop-tools">

      <input id="add-input" placeholder="Add to Aldi…" autocomplete="off" enterkeyhint="go" aria-label="Add item">
      <button class="btn primary-store" type="submit">Add</button>
      <span id="photo-wrap"><button class="btn ghost" id="import-btn" type="button" aria-label="Add from a photo, link or text">Import</button></span>

    <div class="tools">

  <div id="list"></div>

    <p class="status">Then get the list ready for the next shop:</p>
    <div class="row">
      <button class="btn" id="c-clear">Remove ticked items</button>
      <button class="btn ghost" id="c-untick">Keep everything, untick it</button>
      <button class="btn ghost" id="c-cancel">Cancel</button>

</div>

// brands you always buy at Woolies: these override the mid-range/premium guess
const BRAND_PREFS={"milk":"Norco 2L"};
// the second round (mainstream brands). Untouched items on these move up to mid-range/premium too.
const BRANDED_WW={"cherry tomatoes":4.5,"basil":3.5,"red chilli":0.6,"coriander":3.5,"milk":4.9,"long life milk":2.6,"orange juice":6.5,"spiral pasta":2.8,
 "chicken stock":4.0,"minced garlic":4.5,"coconut milk":2.9,"hokkien noodles":3.0,"vermicelli noodles":2.8,"honey":8.5,"canola oil":5.5,"roasted capsicum":5.5,

const OLD_WW={"red & green capsicum":4.5,"onions":3.5,"red onion":1.2,"lemongrass":3.5,"zucchini":1.2,"cherry tomatoes":3.9,"rocket":3.5,"basil":3.0,
 "green beans":4.0,"shallots":2.9,"red chilli":0.5,"coriander":3.0,"milk":3.4,"long life milk":1.9,"orange juice":5.5,"spiral pasta":1.6,"chicken stock":2.5,
 "minced garlic":3.0,"coconut milk":1.8,"hokkien noodles":2.5,"vermicelli noodles":2.6,"honey":7.0,"canola oil":5.0,"roasted peppers":4.5,"roasted capsicum":4.5,
 "kalamata olives":4.5,"sun-dried tomatoes":6.5,"choc chips":4.5,"frozen mango":8.0,"dish soap":3.5,"dishwashing liquid":3.5,"toilet paper":12.0,"ziplock bags":3.5,
 "alfoil":4.5,"laksa paste":4.5,"sambal oelek":3.5,"sriracha":5.0,"rinse aid":9.0};
const KEY="fortnight-shop-v2";
let state=null;
try{state=JSON.parse(localStorage.getItem(KEY))}catch(e){}

/* The shop you've already done lives in state.shops[0] ({id:"current", date, recipes:[recipe ids]}).
   The Made tab shows those recipes; the shopping list itself is always the next shop. */

/* Woolies aisles at Charters Towers. The order below is the walking order the Woolies list follows;
   each item's aisle is remembered by name in state.aisles (shared), so it's set once and reused. */
const WW_AISLES=["Fruit & veg","Bakery","Deli","Meat & seafood",...Array.from({length:20},(_,k)=>"Aisle "+(k+1)),"Dairy & eggs","Freezers","Front of store"];
state.aisles=Array.isArray(state.aisles)?state.aisles:[];
const aisleKey=n=>"a-"+norm(n).replace(/[^a-z0-9]+/g,"-").slice(0,120);
const memAisle=n=>{const m=state.aisles.find(x=>x.id===aisleKey(n));return m?m.aisle:"";};
const wwAisle=i=>i.wwAisle||memAisle(i.name)||"";
function setAisle(n,a){
  const id=aisleKey(n), k=state.aisles.findIndex(x=>x.id===id);
  if(!a){if(k>=0)state.aisles.splice(k,1);return;}
  if(k<0)state.aisles.push({id,name:n,aisle:a}); else state.aisles[k]={...state.aisles[k],name:n,aisle:a};
}
// items can belong to several recipes
state.items.forEach(i=>{if(!Array.isArray(i.recipes))i.recipes=i.recipe?[i.recipe]:[];delete i.recipe;});
const has=(i,name)=>i.recipes.includes(name);
/* Each item keeps both prices: aldiPrice and wwPrice. Its cost is the price at the store it's
   listed under, so moving it between Aldi and Woolies changes the cost. avail = how reliably Aldi stocks it. */
const numOrNull=v=>v==null||v===""||!isFinite(+v)?null:+v;
function toTwoPrices(x){
  if(!x)return x;
  if(x.aldiPrice===undefined&&x.wwPrice===undefined){
    // older saves had one "price" (at the listed store) and a Woolies "backup"
    let a=null,w=numOrNull(x.backup);
    if(x.price!=null){if(x.store==="ww")w=+x.price;else a=+x.price;}
    const p=PRICES[String(x.name||"").toLowerCase()];
    if(p){if(a==null)a=p[0];if(w==null)w=p[2];if(!x.avail)x.avail=p[1];}
    x.aldiPrice=a; x.wwPrice=w;
  }
  delete x.price; delete x.backup;
  if(!x.avail)x.avail="yes";
  // swap an untouched first-round Woolies estimate for the branded Charters Towers one
  if((x.wwBrand||0)<3){const k=String(x.name||"").toLowerCase(), p=PRICES[k];
    const was=v=>v!=null&&x.wwPrice!=null&&Math.abs(x.wwPrice-v)<0.005;
    if(p&&(was(OLD_WW[k])||was(BRANDED_WW[k])||(k==="milk"&&was(5.8))))x.wwPrice=p[2];
    x.wwBrand=3;}
  return x;
}
function seedPrice(x){
  toTwoPrices(x);
  const p=PRICES[String(x.name||"").toLowerCase()];
  if(!p)return;
  if(x.aldiPrice==null)x.aldiPrice=p[0];
  if(x.wwPrice==null)x.wwPrice=p[2];
  x.wwBrand=3;
  if(!x.avail||x.avail==="yes")x.avail=p[1];
}
/* Shopping trip: "both" = Aldi trip (Aldi items at Aldi, Woolies items at Woolies);
   "ww" = Woolies-only trip (everything from both lists bought and priced at Woolies).
   Items keep their own store, so switching back restores the two lists. */
/* "coles" works like Woolies only: one list, everything bought and priced at Coles */
const tripWW=()=>state&&(state.trip==="ww"||state.trip==="coles"); // one-store trip
const isColes=()=>state&&state.trip==="coles";
const oneName=()=>isColes()?"Coles":"Woolworths";
const effStore=x=>tripWW()?"ww":x.store;
// Coles prices fall back to the Woolies price until Claude has estimated one
const priceOf=x=>x?(isColes()?(x.colesPrice??x.wwPrice):effStore(x)==="ww"?x.wwPrice:x.aldiPrice)??null:null;
const otherPrice=x=>x?(x.store==="ww"?x.aldiPrice:x.wwPrice)??null:null;
state.items.forEach(toTwoPrices);
state.items.forEach(seedPrice);
const low=s=>String(s).trim().toLowerCase();
// matching key that ignores case, punctuation and simple plurals (onion = Onions)
// Australian supermarket names: US/UK names are swapped for what's on the shelf here
const AU_NAMES=[
  [/\b(?:bell|sweet) peppers?\b/gi,"capsicum"],
  [/\broasted (?:red )?peppers?\b/gi,"roasted capsicum"],
  [/\b(?:scallions?|green onions?|spring onions?|eschall?ots?|eshall?ots?)\b/gi,"shallots"],
  [/\bcilantro\b/gi,"coriander"],[/\barugula\b/gi,"rocket"],
  [/\bcourgettes?\b/gi,"zucchini"],[/\baubergines?\b/gi,"eggplant"],
  [/\bground (beef|pork|chicken|lamb|turkey|veal)\b/gi,"$1 mince"],
  [/\bshrimps?\b/gi,"prawns"],
  [/\b(?:heavy whipping|heavy|whipping|double) cream\b/gi,"thickened cream"],
  [/\b(?:powdered|confectioners'?) sugar\b/gi,"icing sugar"],[/\bsuperfine sugar\b/gi,"caster sugar"],
  [/\ball[- ]purpose flour\b/gi,"plain flour"],[/\bself[- ]rising flour\b/gi,"self-raising flour"],
  [/\bcorn ?starch\b/gi,"cornflour"],[/\bbaking soda\b/gi,"bicarb soda"],
  [/\bgarbanzo beans?\b/gi,"chickpeas"],[/\bbeets?\b/gi,"beetroot"],[/\brutabagas?\b/gi,"swede"],
  [/\bromaine(?: lettuce)?\b/gi,"cos lettuce"],[/\bsnow ?peas?\b/gi,"snow peas"],
  [/\b(?:plastic|saran) wrap\b|\bcling film\b/gi,"cling wrap"],
  [/\b(?:alumini?um foil|tin foil|al foil|foil)\b/gi,"alfoil"],
  [/\b(?:dish soap|dishwashing soap|dish detergent|washing[- ]up liquid)\b/gi,"dishwashing liquid"],
  [/\b(chicken|beef|vegetable|veggie) broth\b/gi,"$1 stock"],
  [/\bketchup\b/gi,"tomato sauce"],[/\bcandy\b/gi,"lollies"],[/\bcookies\b/gi,"biscuits"],[/\bjell-?o\b/gi,"jelly"],
  [/\bhamburger buns?\b/gi,"burger buns"],[/\bfrench fries\b/gi,"frozen chips"],
  [/\b(?:garbage|trash) bags?\b/gi,"bin liners"],[/\bpaper towels\b/gi,"paper towel"],
  [/\bchil(?:i|e)\b/gi,"chilli"],[/\bchil(?:i|e)s\b/gi,"chillies"]
];
function auName(n){
  let t=String(n||"").trim(); if(!t)return t;
  for(const[re,to] of AU_NAMES)t=t.replace(re,to);
  t=t.replace(/\balfoil alfoil\b/i,"alfoil");
  return t.charAt(0).toUpperCase()+t.slice(1);
}
// ingredients that are used the same way count as one item
const SAME_AS={
  "shallot":"spring onion","eshallot":"spring onion","eschalot":"spring onion","eschallot":"spring onion",
  "green onion":"spring onion","scallion":"spring onion","spring onion":"spring onion",
  "cilantro":"coriander","courgette":"zucchini","arugula":"rocket",
  "chili":"chilli","chile":"chilli","red chili":"red chilli","red chile":"red chilli"
};
// "Fresh coriander", "Coriander bunch" and "Coriander" are one item; size and packaging words don't make a new one
const FILLER=/\b(fresh|large|small|medium|bunch(es)?|punnets?|packets?|packs?|cans?|tins?|jars?|bags?|of|cloves?|whole)\b/g;
const norm=s=>{const b=low(auName(s)).replace(/[^a-z0-9]+/g," ");const t=b.replace(FILLER," ").replace(/\s+/g," ").trim()||b.trim();
  const k=t.replace(/(es|s)$/,"");return SAME_AS[k]||k;};
const findDup=(name,exceptId)=>state.items.find(i=>i.id!==exceptId&&norm(i.name)===norm(name));
/* Quantity model: each list item keeps what each recipe needs (needs[recipe]) plus any extra
   you added yourself (needs._own). The amount to buy is the total of those, so adding the same
   recipe again replaces its amount instead of stacking on top. */
const recipeSum=i=>Object.entries(i.needs||{}).reduce((a,[k,v])=>k==="_own"?a:a+(+v||0),0);
function syncQty(i){i.needs=i.needs||{};i.qty=Math.max(1,recipeSum(i)+(+i.needs._own||0));}
function setNeed(i,recipe,q){
  i.needs=i.needs||{}; i.needs[recipe]=Math.max(1,+q||1);
  if(!i.recipes.includes(recipe))i.recipes.push(recipe); syncQty(i);
}
function dropNeed(i,recipe){if(i.needs)delete i.needs[recipe];i.recipes=i.recipes.filter(x=>x!==recipe);syncQty(i);}
function needsText(i){
  const parts=Object.entries(i.needs||{}).filter(([k,v])=>k!=="_own"&&v).map(([k,v])=>`${esc(k)} ${v}`);
  const own=+((i.needs||{})._own)||0;
  if(own>0)parts.push(`extra ${own}`);
  return parts.length>1||(parts.length===1&&own<=0&&recipeSum(i)!==i.qty)?parts.join(" + "):"";
}
// combine x into the existing list item ex without doubling up
function mergeInto(ex,x){
  ex.done=false; ex.needs=ex.needs||{};
  const xr=(x.recipes||[]).filter(Boolean);
  if(xr.length){
    // recipe quantities: set this recipe's share, never add on top of it
    xr.forEach((r,k)=>setNeed(ex,r,x.needs&&x.needs[r]!=null?x.needs[r]:(k===0?x.qty:1)));
    if(x.needs&&+x.needs._own>0)ex.needs._own=(+ex.needs._own||0)+(+x.needs._own);
  }else ex.needs._own=(+ex.needs._own||0)+(x.qty||1); // a plain extra you asked for
  syncQty(ex);
  if(ex.aldiPrice==null&&x.aldiPrice!=null)ex.aldiPrice=x.aldiPrice;

function guessAisle(n){
  n=n.toLowerCase();
  if(/frozen|ice cream/.test(n))return"Frozen";
  if(/chicken|beef|mince|pork|lamb|sausage|bacon|ham|fish|salmon|prawn|steak|thigh|breast/.test(n)&&!/stock/.test(n))return"Meat & deli";
  if(/milk|cheese|yog|butter|juice|cream|egg/.test(n)&&!/coconut|peanut/.test(n))return"Dairy & drinks";
  if(/bread|wrap|roll|bun|bagel|muffin/.test(n))return"Bakery";
  if(/soap|paper|bag|foil|cling|rinse|detergent|tissue|spray|sponge|bin liner|wash/.test(n))return"Household";
  if(/apple|banana|onion|tomato|lettuce|carrot|potato|herb|basil|lemon|lime|capsicum|chilli|zucchini|bean|spinach|mushroom|avocado|ginger|coriander|parsley|broccoli|cucumber|fruit|berr|rocket|shallot|grass/.test(n)&&!/dried|paste|jar|tin|can/.test(n))return"Fruit & veg";
  if(/pasta|rice|noodle|stock|sauce|oil|tin|can|paste|coconut|flour|sugar|honey|spice|chip|cereal|olive|jar|vinegar/.test(n))return"Pantry";
  return"Other";
}

/* ---------- new recipe: name, ingredients and method together ---------- */
function parseLine(line){
  let t=line.replace(/^[\s\-•*·]+/,"").trim(); if(!t)return null;
  let qty=1, m=t.match(/^(\d+)\s*(x|×)?\s+(.*)$/i);
  if(m&&+m[1]<=24&&!/^(g|kg|ml|l|cups?|tbsp|tsp)\b/i.test(m[3])){qty=+m[1];t=m[3];}
  else{m=t.match(/^(.*?)\s*(x|×)\s*(\d+)$/i);if(m){qty=+m[3];t=m[1];}}
  let note=""; m=t.match(/^(.*?)[\s,(]+(\d+(?:\.\d+)?\s?(?:g|kg|ml|l|pk|pack))\)?$/i);
  if(m){t=m[1];note=m[2];}
  else{m=t.match(/^(\d+(?:\.\d+)?\s?(?:g|kg|ml|l))\s+(?:of\s+)?(.*)$/i);if(m){note=m[1];t=m[2];}}
  const name=auName(t.replace(/[,(]+$/,"").trim()); if(!name)return null;
  const g={name:name.charAt(0).toUpperCase()+name.slice(1),qty,note,aisle:guessAisle(name),store:"aldi"};
  seedPrice(g); return g;
}
/* New recipe: fill the form from a photo, a link or pasted text */
async function fillRecipe(src){
  const st=$("nr-pstatus"); st.classList.remove("err");

function saveEdit(r,name,err){
  if(low(name)!==low(r.name)&&state.recipes.some(x=>x!==r&&low(x.name)===low(name))){
    err.hidden=false;err.textContent=`You already have a recipe called ${name}. Pick another name.`;$("nr-name").focus();return;}
  if(name!==r.name){ // rename: list items tagged with the old name follow it
    state.items.forEach(i=>{i.recipes=i.recipes.map(x=>x===r.name?name:x);if(i.needs&&i.needs[r.name]!=null){i.needs[name]=i.needs[r.name];delete i.needs[r.name];}});
    r.name=name;
  }
  // unchanged lines keep everything saved with them (store, aisle, prices); changed lines keep them when the name still matches
  const old=r.ingredients, out=[];
  $("nr-ings").value.split(/\n+/).forEach(line=>{
    const same=old.find(g=>ingLine(g)===line.trim());
    let g=same?{...same}:parseLine(line); if(!g)return;
    if(!same){const o=old.find(x=>norm(x.name)===norm(g.name));if(o)g={...o,name:g.name,qty:g.qty,note:g.note};}
    const d=out.find(x=>norm(x.name)===norm(g.name)); if(d)d.qty=(d.qty||1)+(g.qty||1); else out.push(g);
  });
  r.ingredients=out; r.notes=$("nr-method").value.trim();
  save(); render();
  const missing=out.filter(g=>ingPrice(g)==null);
  if(sample&&missing.length)estimateItems(missing);
  openRecipe(state.recipes.indexOf(r));
}

        ${tripWW()?`<div class="seg pc two"><button type="button" data-j="${j}" data-v="have" aria-pressed="${!x.need}">Have it</button><button type="button" data-j="${j}" data-v="add" aria-pressed="${x.need}">Add</button></div>`

/* ---------- prices via Claude ---------- */
const FIELDS=`"aldi" = typical ALDI Australia regular price in AUD for one pack/each in Queensland (number; your best estimate even if ALDI rarely stocks it);
"ww" = typical regular shelf price in AUD at Woolworths Charters Towers (regional Queensland) for a MID-RANGE TO PREMIUM brand, e.g. a2, Nudie, Barilla or De Cecco, Massel, Beechworth, Sandhurst, Always Fresh, Marion's Kitchen, Lindt or Cadbury baking, Creative Gourmet, Fairy, Kleenex, Glad, Finish (number). Never use Woolworths own brand, Essentials, Macro or the cheapest budget brand. When an item matches one of these, price that exact brand instead: ${Object.entries(BRAND_PREFS).map(([k,v])=>k+" = "+v).join("; ")}. For fresh fruit, veg and meat with no brand, use the regular Woolworths price;
"coles" = typical regular shelf price in AUD at Coles in regional Queensland for the same kind of MID-RANGE TO PREMIUM brand (never Coles own brand) (number);
"avail" = how reliably ALDI Australia stocks it: "yes", "maybe" or "rarely".`;
async function askPrices(list){
  const res=await sample.json(`Estimate supermarket prices for these items. Return only a JSON array in the same order, one object per item: {"name":string,"aldi":number,"ww":number,"coles":number,"avail":"yes"|"maybe"|"rarely"}.
${FIELDS}
Use the size in the note when given. Items:
${JSON.stringify(list.map(x=>({name:x.name,note:x.note||"",store:x.store==="ww"?"Woolworths":"Aldi"})))}`,{modelTier:"quick"});
  return (Array.isArray(res)?res:[]).map(r=>({aldiPrice:numOrNull(r.aldi),wwPrice:numOrNull(r.ww),colesPrice:numOrNull(r.coles),avail:["yes","maybe","rarely"].includes(r.avail)?r.avail:"yes"}));
}
function isPending(id){try{return estPending.has(id);}catch(e){return false;}}
// any item saved without a price (typed, imported, from a recipe or the assistant) gets estimated in the background
const estPending=new Set(), estTried=new Set(); let estTimer=null;
function queueAutoEst(){
  if(!sample)return; clearTimeout(estTimer);
  estTimer=setTimeout(async()=>{
    const list=state.items.filter(i=>(priceOf(i)==null||(isColes()&&i.colesPrice==null))&&!estTried.has(i.id)&&!estPending.has(i.id)).slice(0,25);
    if(!list.length)return;
    list.forEach(i=>{estPending.add(i.id);estTried.add(i.id);}); render();
    try{const res=await askPrices(list);
      list.forEach((it,k)=>{const r=res[k];if(!r)return;
        if(it.aldiPrice==null&&r.aldiPrice!=null)it.aldiPrice=r.aldiPrice;
        if(it.wwPrice==null&&r.wwPrice!=null)it.wwPrice=r.wwPrice;
        if(it.colesPrice==null&&r.colesPrice!=null)it.colesPrice=r.colesPrice;
        if(!it.avail)it.avail=r.avail;});
    }catch(e){}
    list.forEach(i=>estPending.delete(i.id)); save(); render();
  },600);
}
async function estimateItems(list){
  if(!sample||!list.length)return;
  const btn=$("est-missing"); if(btn){btn.disabled=true;btn.textContent="Estimating…";}
  try{
    const res=await askPrices(list);
    list.forEach((it,k)=>{const r=res[k];if(r){if(r.aldiPrice!=null)it.aldiPrice=r.aldiPrice;if(r.wwPrice!=null)it.wwPrice=r.wwPrice;if(r.colesPrice!=null)it.colesPrice=r.colesPrice;it.avail=r.avail;}});
    save();
  }catch(e){if(btn)btn.textContent=errCopy(e&&e.code);return;}
  render();
}

async function readLink(){
  const url=$("imp-url").value.trim(), err=$("imp-err");
  if(!/^https?:\/\/\S+\.\S+/.test(url)){err.hidden=false;err.textContent="Enter a full link starting with https://";return;}
  if(!mcp){err.hidden=false;err.textContent="Links can't be opened here. Use a screenshot in Photo, or paste the ingredients into Text.";return;}
  $("imp-go").disabled=true;$("imp-go").textContent="Opening…";
  try{
    await mcp.callTool("host:claude_browser","navigate",{url});
    const r=await mcp.callTool("host:claude_browser","get_page_text",{});
    let text=typeof r.payload==="string"?r.payload:(r.content||[]).filter(c=>c.type==="text").map(c=>c.text).join("\n");
    if(!text||text.trim().length<40)throw{code:"empty"};
    extract({text:text.slice(0,30000),label:"link",url});
  }catch(e){
    err.hidden=false;
    err.textContent=e&&(e.code==="server_not_connected"||e.code==="not_granted"||e.code==="unavailable")
      ?"Links only open in the Claude desktop app. Take a screenshot and use Photo, or paste the ingredients into Text."
      :"Couldn't read that page. Take a screenshot and use Photo, or paste the ingredients into Text.";
    $("imp-go").disabled=false;$("imp-go").textContent="Read link";
  }
}

async function extract(src){
  busy=true; ctl=new AbortController();
  openSheet(`<h2>Reading your ${src.label}…</h2><p class="status">Picking out items and estimating prices. This can take up to a minute.</p>
    <div class="actions"><span class="sp"></span><button class="btn ghost" id="p-stop" type="button">Stop</button></div>`);
  $("p-stop").onclick=()=>ctl.abort();
  const what=src.image?"The image is a photo of a handwritten or printed shopping list, a recipe, a recipe web page, or products."
    :`Below is ${src.url?"the text of the web page "+src.url:"text the user pasted"}. It may be a recipe, an ingredient list or a shopping list.`;
  const prompt=`${what} Extract every grocery or household item to buy.
Skip anything crossed out. For recipes, list each ingredient once, ignoring basics like water; fold amounts into qty (packs to buy) and note (size).
Default store is "${state.view==="ww"?"ww":"aldi"}"; use "ww" when the item is marked (ww), Woolies or Woolworths, "aldi" when marked Aldi, and "ww" for items ALDI Australia rarely stocks.
If it is a recipe, put its title in "recipes" for every ingredient; an item can list several recipes. Otherwise leave recipes empty unless one is written.
Known recipes: ${state.recipes.map(r=>r.name).join(", ")||"none"}.
Aisle must be one of: ${AISLES.join(", ")}.
${FIELDS}
Reply with only JSON in this shape:
{"recipe":null,"items":[{"name":"Cherry tomatoes","qty":1,"note":"250g punnet","aisle":"Fruit & veg","store":"aldi","recipes":[],"aldi":2.99,"ww":3.9,"coles":3.9,"avail":"yes"}]}
If it is a recipe, set "recipe" to {"title":string,"method":string} with the method steps one per line (keep the original steps); otherwise null.
qty is a whole number of packs/items (default 1). Use clean, capitalised Australian supermarket names (capsicum not bell pepper, coriander not cilantro, shallots for spring/green onions, beef mince not ground beef, prawns not shrimp, plain flour, cornflour, icing sugar, thickened cream, tomato sauce not ketchup).${src.text?"\n\n---\n"+src.text:""}`;
  try{
    const res=await sample.json(prompt,src.image?{images:[src.image],signal:ctl.signal}:{signal:ctl.signal});
    busy=false;
    const num=v=>v==null||v===""||!isFinite(+v)?null:+v;
    const list=Array.isArray(res)?res:(res&&Array.isArray(res.items)?res.items:[]);
    const rec=res&&!Array.isArray(res)&&res.recipe&&res.recipe.title?res.recipe:null;
    const items=list.filter(x=>x&&x.name).map(x=>{const store=x.store==="ww"?"ww":"aldi";return{
      id:uid(),name:auName(String(x.name)),note:String(x.note||"").trim(),qty:Math.max(1,Math.round(+x.qty||1)),
      aisle:AISLES.includes(x.aisle)?x.aisle:guessAisle(String(x.name)),store,
      recipes:(Array.isArray(x.recipes)?x.recipes:x.recipe?[x.recipe]:[]).map(r=>String(r).trim()).filter(Boolean),
      aldiPrice:num(x.aldi??(store==="aldi"?x.price:null)),wwPrice:num(x.ww??(store==="ww"?x.price:x.backup)),colesPrice:num(x.coles),avail:["yes","maybe","rarely"].includes(x.avail)?x.avail:"yes",done:false}});
    items.forEach(seedPrice);
    if(!items.length){openSheet(`<h2>No items found</h2><p class="status">I couldn't find anything to buy in that ${src.label}.</p><div class="actions"><span class="sp"></span><button class="btn" onclick="closeSheet()">OK</button></div>`);return;}
    if(rec){
      const rn=ensureRecipe(String(rec.title)), r=state.recipes.find(x=>x.name===rn);
      items.forEach(x=>{if(!x.recipes.some(n=>low(n)===low(rn)))x.recipes.push(rn);});
      if(rec.method&&!r.notes)r.notes=String(rec.method);
      save();
    }
    reviewImport(items);
  }catch(e){
    busy=false;
    if(e&&e.code==="cancelled"){closeSheet();return;}
    openSheet(`<h2>Couldn't read that</h2><p class="status err">${esc(errCopy(e&&e.code))}</p><div class="actions"><span class="sp"></span><button class="btn" onclick="closeSheet()">OK</button></div>`);
  }
}

function reviewImport(items){
  // merge double-ups inside the import itself first
  const merged=[];
  items.forEach(x=>{const m=merged.find(y=>norm(y.name)===norm(x.name));if(m){m.qty+=x.qty;x.recipes.forEach(r=>{if(!m.recipes.includes(r))m.recipes.push(r)});}else merged.push(x);});
  items=merged; items.forEach(initNeeds);
  // what the existing line would become after merging
  const after=x=>{const d=findDup(x.name);if(!d)return x.qty;const t={...d,needs:{...(d.needs||{})},recipes:[...d.recipes]};mergeInto(t,x);return t.qty;};
  const ex=n=>findDup(n), dup=n=>!!ex(n);
  const cost=items.reduce((a,x)=>a+(priceOf(x)||0)*x.qty,0);
  openSheet(`<h2>Add ${items.length} item${items.length>1?"s":""}?</h2>
    <p class="status">Untick anything you already have. Items already on your list are unticked; tick one to raise its quantity instead of adding a second line. About ${money(cost)} if you add them all. You can edit each item after adding it.</p>
    <div>${items.map((x,k)=>`<label class="rv"><input type="checkbox" id="pv-${k}" data-k="${k}" ${dup(x.name)?"":"checked"}>
      <span class="txt"><span class="name">${x.qty>1?`<span class="qty">${x.qty}×</span>`:""}${esc(x.name)}${x.note?` <span class="note">${esc(x.note)}</span>`:""}</span>
      <span class="note">${storeName(x.store)} · ${esc(x.aisle)}${x.recipes.length?" · "+esc(x.recipes.join(", ")):""}${dup(x.name)?` · on list as ${ex(x.name).qty||1}×${after(x)!==(ex(x.name).qty||1)?` · tick to make it ${after(x)}×`:" · already counted"}`:""}</span>
      ${availText(x)?`<span class="avail">${esc(availText(x))}</span>`:""}</span>
      <span class="price">${priceOf(x)!=null?money(priceOf(x)*x.qty):"–"}</span></label>`).join("")}</div>
    <div class="actions"><span class="sp"></span><button class="btn ghost" id="pv-cancel">Cancel</button><button class="btn" id="pv-add">Add selected</button></div>`);
  $("pv-cancel").onclick=closeSheet;
  $("pv-add").onclick=()=>{
    // every recipe ingredient is saved to the recipe, even ones left off this shop
    items.forEach(x=>{x.recipes=x.recipes.map(ensureRecipe);x.recipes.forEach(r=>rememberIngredient(r,x));});
    document.querySelectorAll(".rv input:checked").forEach(c=>{const x=items[c.dataset.k],d=findDup(x.name);if(d)mergeInto(d,x);else state.items.push(x);});
    save();closeSheet();render();
  };
}

      <div class="ai-chips">${AI_SUGGEST.map((s,k)=>`<button type="button" data-sug="${k}">${esc(s)}</button>`).join("")}</div></div>`)
    +aiChat.map(m=>`<div class="ai-msg ${m.role}">${m.role==="user"?`<p>${esc(m.content)}</p>`:aiMd(m.content)}${m.did&&m.did.length?`<div class="ai-did">${m.did.map(d=>`<span>✓ ${esc(d)}</span>`).join("")}</div>`:""}</div>`).join("")
    +(aiBusy?`<div class="ai-msg assistant ai-wait"><span></span><span></span><span></span></div>`:"");
  log.querySelectorAll("[data-sug]").forEach(b=>b.onclick=()=>aiSend(AI_SUGGEST[+b.dataset.sug]));
  log.scrollTop=log.scrollHeight;
  $("ai-send").textContent=aiBusy?"Stop":"Send";
}
function openAssistant(){
  if(!sample){openShareAssistant();return;} // no Claude key on this phone: use the Claude app instead
  openSheet(`<div class="ai-wrap"><div class="ai-head"><h2>Ask Claude</h2><button class="link" type="button" id="ai-new">New chat</button></div>
    <div class="ai-log" id="ai-log" aria-live="polite"></div>
    <form class="ai-form" id="ai-form"><textarea id="ai-in" rows="1" placeholder="Ask Claude…" aria-label="Message to Claude"></textarea><button class="btn" type="submit" id="ai-send">Send</button></form></div>`);
  aiDraw();
  const inp=$("ai-in");
  inp.oninput=()=>{inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,140)+"px";};
  inp.onkeydown=e=>{if(e.key==="Enter"&&!e.shiftKey&&!matchMedia("(pointer:coarse)").matches){e.preventDefault();$("ai-form").requestSubmit();}};
  $("ai-form").onsubmit=e=>{e.preventDefault();if(aiBusy){aiCtl&&aiCtl.abort();return;}const t=inp.value.trim();if(!t)return;inp.value="";inp.style.height="auto";aiSend(t);};
  $("ai-new").onclick=()=>{if(aiBusy)return;aiChat=[];aiSave();aiDraw();};
}
async function aiSend(text){
  if(!sample||aiBusy)return;
  aiChat.push({role:"user",content:text}); aiBusy=true; aiDid=[]; aiDraw();
  aiCtl=new AbortController();
  // the app's context rides along with the first message of the conversation
  const hist=aiChat.slice(-20).map(m=>({role:m.role,content:m.content}));
  while(hist.length&&hist[0].role!=="user")hist.shift();
  hist[0]={role:"user",content:aiContext()+"\n\n---\n\n"+hist[0].content};
  try{
    const res=await sample(hist,{tools:AI_TOOLS,modelTier:"complex",web:true,signal:aiCtl.signal,cache:false});
    aiChat.push({role:"assistant",content:(res&&res.text||"").trim()||"Done.",did:aiDid.slice()});
  }catch(e){
    const msg=e&&e.code==="cancelled"?"Stopped.":errCopy(e&&e.code);
    aiChat.push({role:"assistant",content:msg,did:aiDid.slice()});
  }
  aiBusy=false; aiSave(); aiDraw();
}

/* ---------- free route: ask in the Claude app, paste the answer back ----------
   Without an API key the app can't run Claude itself, so it hands the question (plus the list and recipes)
   to the Claude app, which runs on the person's own Claude account. The reply comes back through Import → Text. */
const SHARE_FORMAT=`If you suggest anything to buy, or a recipe to save, end your reply with a section in exactly this format so I can paste it into my app:

For Fortnight Shop
Recipe: <recipe name — only include this line for a recipe>
2 x Coconut milk 400ml (Aldi)
1 x Laksa paste (Woolies)
Method:
1. <steps — only for a recipe>

Use Australian supermarket names, one item per line, "(Aldi)" or "(Woolies)" after each.`;
function shareText(question){
  const sh=curShop();
  const list=state.items.map(i=>`- ${i.qty>1?i.qty+"× ":""}${i.name}${i.note?" "+i.note:""} (${i.store==="ww"?"Woolies":"Aldi"})${i.done?" ✓":""}`).join("\n")||"(empty)";
  const recs=full=>state.recipes.map(r=>{
    const flags=[]; if(sh&&sh.recipes.includes(r.id))flags.push(sh&&madeSince(r,sh.date).length?"made this fortnight":"to cook this fortnight");
    if(lastMade(r))flags.push("last made "+dayName(lastMade(r)));
    return `- ${r.name}${flags.length?" ("+flags.join(", ")+")":""}${full?": "+r.ingredients.map(g=>g.name).join(", "):""}`;}).join("\n")||"(none)";
  const head=`I use my shopping app "Fortnight Shop". ${question}

About us: a household in Charters Towers, Queensland. We do a big shop every fortnight: Aldi first, then Woolworths for the rest (mid-range to premium brands, never Woolworths own brand; Norco milk). Today is ${new Date().toLocaleDateString("en-AU",{weekday:"long",day:"numeric",month:"long"})}.

Shopping list for the next shop:
${list}

Saved recipes:
`;
  let t=head+recs(true)+"\n\n"+SHARE_FORMAT;
  if(encodeURIComponent(t).length>7500)t=head+recs(false)+"\n\n"+SHARE_FORMAT; // keep the link short enough to open
  return t;
}
const claudeLink=t=>"https://claude.ai/new?q="+encodeURIComponent(t);
function copyText(t,btn,label){
  const ok=()=>{if(btn){btn.textContent="Copied";setTimeout(()=>btn.textContent=label,1800);}};
  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(t).then(ok,()=>fallback());else fallback();
  function fallback(){const ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy");ok();}catch(e){}ta.remove();}
}
function openShareAssistant(){
  const sa=window.STANDALONE;
  openSheet(`<h2>Ask Claude</h2>
    <p class="status">Free with your Claude account. Your question opens in the Claude app with your list and recipes attached.</p>
    <textarea id="aq" rows="3" placeholder="e.g. Plan 7 dinners from my recipes for this fortnight"></textarea>
    <div class="ai-chips">${AI_SUGGEST.map((s,k)=>`<button type="button" data-aqs="${k}">${esc(s)}</button>`).join("")}</div>
    <div class="actions"><a class="btn" id="aq-open" href="#" target="_blank" rel="noopener">Ask in the Claude app</a><button class="btn ghost" type="button" id="aq-copy">Copy question</button></div>
    <p class="status"><strong>Bringing the answer back:</strong> in Claude, copy the reply (or just its <em>For Fortnight Shop</em> part). Then here, tap <strong>Import → Text</strong>, paste, and add. Double-ups are merged as usual.</p>
    <p class="status">If the question doesn't appear in Claude, tap <strong>Copy question</strong>, open Claude, and paste it.</p>
    ${sa?`<p class="status">Have a Claude API key? <button class="link" type="button" id="aq-key">Add it in Settings</button> and Claude can change the list for you, right inside the app.</p>`:""}`);
  const q=$("aq"), a=$("aq-open");
  const sync=()=>{const t=q.value.trim();a.href=t?claudeLink(shareText(t)):"#";a.classList.toggle("off",!t);};
  q.oninput=sync; sync();
  a.onclick=e=>{if(!q.value.trim()){e.preventDefault();q.focus();}};
  scrim.querySelectorAll("[data-aqs]").forEach(b=>b.onclick=()=>{q.value=AI_SUGGEST[+b.dataset.aqs];sync();});
  $("aq-copy").onclick=()=>{const t=q.value.trim();if(!t){q.focus();return;}copyText(shareText(t),$("aq-copy"),"Copy question");};
  if($("aq-key"))$("aq-key").onclick=()=>{closeSheet();sa.openSettings();setTimeout(()=>{const k=$("fs-ck");if(k){k.scrollIntoView({block:"center"});k.focus();}},150);};
}
// reads pasted text (a Claude reply, a recipe or any list) into items, without needing Claude
function parsePasted(text){
  let lines=String(text||"").split(/\r?\n/);
  const at=lines.findIndex(l=>/for fortnight shop/i.test(l));
  if(at>=0)lines=lines.slice(at+1);
  let recipe="", method=[], inMethod=false; const items=[];
  for(let raw of lines){
    let l=raw.replace(/\*\*/g,"").trim();
    if(!l){continue;}
    const rm=l.match(/^recipe\s*:\s*(.+)$/i); if(rm){recipe=rm[1].trim();continue;}
    if(/^(method|steps|instructions)\s*:?\s*$/i.test(l)){inMethod=true;continue;}
    if(inMethod){method.push(l);continue;}
    if(/^(#|ingredients\s*:?$|shopping list\s*:?$)/i.test(l)||/:$/.test(l))continue;
    let store=null;
    l=l.replace(/\s*[\(\[]\s*(aldi|woolies|woolworths|ww)\s*[\)\]]\s*/i,(m,s)=>{store=/^aldi$/i.test(s)?"aldi":"ww";return " ";}).trim();
    l=l.replace(/^\s*(\d+[.)])\s+/,"").replace(/\s*✓\s*$/,"");
    const g=parseLine(l); if(!g||g.name.length>60)continue;
    const x={id:uid(),name:g.name,note:g.note||"",qty:g.qty||1,aisle:g.aisle,store:store||(state.view==="ww"?"ww":"aldi"),recipes:recipe?[recipe]:[],done:false};
    seedPrice(x); items.push(x);
  }
  return {items,recipe,method:method.join("\n")};
}
function importPasted(text){
  const {items,recipe,method}=parsePasted(text);
  if(recipe){const rn=ensureRecipe(recipe),r=state.recipes.find(x=>x.name===rn);if(method&&!r.notes)r.notes=method;items.forEach(x=>x.recipes=[rn]);save();}
  if(!items.length){openSheet(`<h2>No items found</h2><p class="status">Paste one item per line, like "2 x Coconut milk 400ml (Aldi)".</p><div class="actions"><span class="sp"></span><button class="btn" type="button" onclick="closeSheet()">OK</button></div>`);return;}
  reviewImport(items);
}

// used by the standalone app's Settings (backup and restore)
window.FS={
  backup:()=>({app:"fortnight-shop",version:1,at:new Date().toISOString(),items:state.items,recipes:state.recipes,shops:state.shops,aisles:state.aisles}),
  restore(b){
    if(!b||!Array.isArray(b.items)||!Array.isArray(b.recipes))throw new Error("That file isn't a Fortnight Shop backup.");
    ["items","recipes","shops","aisles"].forEach(c=>{state[c].length=0;(b[c]||[]).forEach(o=>state[c].push(JSON.parse(JSON.stringify(o))));});
    state.items.forEach(i=>{i.recipes=i.recipes||[];if(!i.needs)i.needs={_own:i.qty||1};toTwoPrices(i);});
    state.recipes.forEach(r=>{r.ingredients=r.ingredients||[];r.notes=r.notes||"";if(!r.id)r.id=uid();r.ingredients.forEach(toTwoPrices);});
    save(); render();
  }
};
// set-up that needs the helpers above
state.recipes.forEach(r=>{if(!r.id)r.id=uid();});
if(!state.shops.length)seedShop();

/* ---------- shared household list ----------
   Items live at items/<id> and recipes at recipes/<id>, one document each, so two people
   ticking at the same time never overwrite each other. Tabs and "Hide ticked" stay per person. */
let sdb=null, shared=false, readOnly=false, syncTimer=null;
const synced={items:{},recipes:{},shops:{},aisles:{}}, pendingDel=new Set(), chains={};
const stable=v=>Array.isArray(v)?"["+v.map(stable).join(",")+"]":v&&typeof v==="object"?"{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")+"}":JSON.stringify(v===undefined?null:v);
const bodyOf=o=>{const{id,...rest}=o;return stable(rest);};
function setSync(st,txt){const el=$("sync");el.dataset.s=st;el.textContent=txt;}
function queueSync(){if(!shared||readOnly)return;clearTimeout(syncTimer);syncTimer=setTimeout(flush,500);}
// what this phone last agreed with the shared list, kept so edits made offline are sent when it reconnects
const SYNC_KEY=KEY+"-synced";
let syncSaveT=0;
function saveSynced(){clearTimeout(syncSaveT);syncSaveT=setTimeout(()=>{try{localStorage.setItem(SYNC_KEY,JSON.stringify(synced))}catch(e){}},300);}
let failed=false;
function write(path,fn){
  chains[path]=(chains[path]||Promise.resolve()).then(fn).then(()=>{
    if(failed){failed=false;setSync("live",liveText());}
  }).catch(e=>{
    if(e&&e.code==="invalid_argument"){readOnly=true;setSync("ro","View only. Ask the owner to invite you as an Editor to make changes.");return;}
    if(e&&e.code==="quota_exceeded"){setSync("err","The shared list is full. Remove some old items or recipes.");return;}
    // forget that this one was sent, so it goes again when the connection is back
    const [c,id]=path.split("/");
    if(synced[c]){const here=(state[c]||[]).some(o=>o.id===id); if(here)delete synced[c][id]; else synced[c][id]="__retry-delete";}
    pendingDel.delete(path); saveSynced();
    failed=true; setSync("err","Offline. Your changes are saved on this phone and will sync when you're back online.");
  });
}
const liveText=()=>window.STANDALONE?"Synced · live":"Shared with your household · live";
addEventListener("online",()=>{if(shared){queueSync();}});
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&shared)queueSync();});
function flush(){
  if(!shared||readOnly)return;
  [["items",state.items],["recipes",state.recipes],["shops",state.shops],["aisles",state.aisles]].forEach(([col,arr])=>{
    const here=new Set();
    arr.forEach((o,k)=>{
      if(!o.id)o.id=uid();
      if(col==="items"&&o.t==null)o.t=Date.now()+k;
      here.add(o.id);
      const b=bodyOf(o);
      if(synced[col][o.id]!==b){synced[col][o.id]=b;const data=JSON.parse(b);write(col+"/"+o.id,()=>sdb.doc(col+"/"+o.id).set(data));}
      saveSynced();
    });
    Object.keys(synced[col]).forEach(id=>{
      if(here.has(id))return;
      delete synced[col][id]; const path=col+"/"+id; pendingDel.add(path);
      write(path,()=>sdb.doc(path).delete().finally(()=>pendingDel.delete(path)));
    });
  });
  saveSynced();
}
let redraw=0, shopsSeen=false;
function applySnap(col,snap){
  const arr=state[col], seen=new Set();
  snap.docs.forEach(d=>{
    if(pendingDel.has(col+"/"+d.id))return;
    seen.add(d.id);
    const data=d.data(), b=stable(data);
    let o=arr.find(x=>x.id===d.id);
    if(o){
      const mine=bodyOf(o);
      // changed on this phone and not sent yet (or a send failed offline): keep it and send it
      if(mine!==b&&(synced[col][d.id]===undefined||mine!==synced[col][d.id])){if(synced[col][d.id]===undefined)synced[col][d.id]=b;queueSync();return;}
      if(bodyOf(o)!==b){Object.keys(o).forEach(k=>{if(k!=="id")delete o[k]});Object.assign(o,JSON.parse(JSON.stringify(data)));}
    }else{o={...JSON.parse(JSON.stringify(data)),id:d.id};arr.push(o);}
    synced[col][d.id]=b;
  });
  // gone from the shared list (someone else removed it)
  for(let k=arr.length-1;k>=0;k--){const o=arr[k];if(synced[col][o.id]!==undefined&&!seen.has(o.id)){delete synced[col][o.id];arr.splice(k,1);}}
  if(col==="items")arr.sort((a,b)=>(a.t||0)-(b.t||0));
  arr.forEach(o=>{if(col==="items"){o.recipes=o.recipes||[];if(!o.needs){o.needs={_own:o.qty||1};}toTwoPrices(o);}else if(col==="recipes"){o.ingredients=o.ingredients||[];o.notes=o.notes||"";o.ingredients.forEach(toTwoPrices);}else if(col==="shops"){o.recipes=o.recipes||[];}});
  if(col!=="shops"&&shared&&!readOnly)queueSync(); // writes back any items converted to two prices
  if(col==="items"&&!readOnly)queueAutoEst(); // items added on another phone get priced too
  if(col==="shops"&&!shopsSeen){shopsSeen=true;
    // a shared list from before the Made tab: set up the current shop once everything has loaded
    if(!arr.length&&!readOnly)setTimeout(()=>{if(!curShop()){seedShop();save();render();}},2500);}
  try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}
  saveSynced();
  cancelAnimationFrame(redraw); redraw=requestAnimationFrame(()=>{
    // keep the screen steady while someone is typing in the list
    const a=document.activeElement; if(a&&a.closest&&a.closest("#list")&&a.matches("input,textarea"))return;
    render();
  });
}
(async()=>{
  try{sdb=await claude.use("db");}catch(e){sdb=null;}
  if(!sdb){setSync("local","Saved on this device only");return;}
  setSync("local","Connecting to the shared list…");
  try{
    let u=null; try{u=await claude.use("user");}catch(e){}
    const canWrite=u&&u.can?await Promise.resolve(u.can("data.write")).catch(()=>null):null;
    if(canWrite===false){readOnly=true;}
    const meta=sdb.doc("meta/info");
    let m=await meta.get();
    if(!m.exists&&!readOnly){
      // first time on the shared list: whoever opens it first brings their saved list across, once
      const lease=await meta.acquire({holder:uid(),ttlMs:20000});
      m=await meta.get();
      if(lease.acquired&&!m.exists){
        shared=true;
        state.recipes.forEach(r=>{if(!r.id)r.id=uid();});
        flush();
        await Promise.all(Object.values(chains));
        await meta.set({seeded:true,at:new Date().toISOString()});
      }else{await new Promise(r=>setTimeout(r,1500));}
    }
    shared=true;
    const localAisles=state.aisles.slice();
    let prev=null; try{prev=JSON.parse(localStorage.getItem(SYNC_KEY));}catch(e){}
    if(prev&&typeof prev==="object"&&Object.keys(prev).some(c=>prev[c]&&Object.keys(prev[c]).length)){
      // this phone has synced before: keep its copy, including anything changed while offline, and merge
      ["items","recipes","shops","aisles"].forEach(c=>{synced[c]=Object.assign(synced[c],prev[c]||{});});
    }else{
      // first time on this phone: the shared list replaces the copy here (nothing local is pushed back)
      state.items.length=0; state.recipes.length=0; state.shops.length=0; state.aisles.length=0;
      ["items","recipes","shops","aisles"].forEach(c=>Object.keys(synced[c]).forEach(k=>delete synced[c][k]));
    }
    const onErr=e=>setSync("err",e&&e.code==="revoked"?"You no longer have access to the shared list.":e&&e.code==="offline"?"Offline. Showing the list saved on this phone.":"Lost the connection to the shared list. Reopen the list to reconnect.");
    sdb.collection("items").onSnapshot(s=>applySnap("items",s),onErr);
    sdb.collection("recipes").onSnapshot(s=>applySnap("recipes",s),onErr);
    sdb.collection("shops").onSnapshot(s=>applySnap("shops",s),onErr);
    let aislesFirst=true;
    sdb.collection("aisles").onSnapshot(s=>{applySnap("aisles",s);
      if(aislesFirst){aislesFirst=false;let add=false;localAisles.forEach(a=>{if(!state.aisles.some(x=>x.id===a.id)){state.aisles.push(a);add=true;}});if(add)save();}},onErr);
    setSync(readOnly?"ro":"live",readOnly?"View only. Ask the owner to invite you as an Editor to make changes.":liveText());
    setTimeout(queueSync,1500); // send anything changed while offline
  }catch(e){
    shared=false; setSync("local","Couldn't reach the shared list, so changes are saved on this device only.");
  }
})();

render();
</script>
